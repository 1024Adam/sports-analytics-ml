name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Lint, Type Check & Offline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check git hygiene (no tracked data, artifacts, or binaries)
        run: |
          TRACKED_FORBIDDEN=$(git ls-files 'data/**' 'artifacts/**' '*.parquet' '*.pkl' '*.joblib')
          if [ -n "$TRACKED_FORBIDDEN" ]; then
            echo "Error: Forbidden data or binary artifact files are tracked in git:"
            echo "$TRACKED_FORBIDDEN"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies from lockfile
        run: uv sync --locked --dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run Mypy static type checker
        run: uv run mypy src tests

      - name: Run Pytest unit & anti-leakage suite
        run: uv run pytest --cov=sports_ml
