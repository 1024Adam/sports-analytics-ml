[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "sports-analytics-ml"
version = "0.1.0"
description = "Modular, leak-free multi-sport machine learning platform starting with NHL hockey."
readme = "docs/architecture.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Adam Reid" }]
dependencies = [
    "httpx>=0.27.0",
    "lightgbm>=4.5.0",
    "polars>=1.9.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.1",
    "tenacity>=9.0.0",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
]

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
]

[project.scripts]
sports-ml = "sports_ml.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_ml"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["sports_ml"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sports_ml", "tests"]
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "lightgbm.*",
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["sports_ml"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
